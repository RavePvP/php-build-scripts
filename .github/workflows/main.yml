name: Build and publish PHP binaries

on:
  push:
    branches: "**"
    tags-ignore: "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # BEGIN TEMP NATIVE PROMOTION
  promote-native-compile:
    name: Promote native extensions into compile.sh
    if: ${{ github.event_name == 'push' && github.ref_name == 'agent/native-math-nbt' && !contains(github.event.head_commit.message, '[native compile promoted]') }}
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/native-math-nbt

      - name: Patch and commit the canonical build script
        run: |
          python3 <<'PY'
          from pathlib import Path

          compile_path = Path('compile.sh')
          text = compile_path.read_text()
          replacements = [
              (
                  'EXT_PATHFINDER_VERSION="132f6c13d864bc7b48521555b9bd8cbd2706cb4c"\n',
                  'EXT_PATHFINDER_VERSION="4f62992e518bd2fc8797103b5a7e3690166b074b"\n'
                  'EXT_MATH_VERSION="ceee39ac0ece476accaa09e58aeb70f66276b6c7"\n'
                  'EXT_NBT_VERSION="099ccb67c57fc0893b2c388f89f363f89f389a51"\n',
              ),
              (
                  'get_github_extension "pathfinder" "$EXT_PATHFINDER_VERSION" "TrixNEW" "ext-pathfinder"\n',
                  'get_github_extension "pathfinder" "$EXT_PATHFINDER_VERSION" "RavePvP" "ext-pathfinder"\n'
                  'get_github_extension "ext_math" "$EXT_MATH_VERSION" "phpMine-MP" "ext-math"\n'
                  'get_github_extension "ext_nbt" "$EXT_NBT_VERSION" "phpMine-MP" "ext-nbt"\n',
              ),
              (
                  '--enable-pathfinder \\\n',
                  '--enable-pathfinder \\\n--enable-ext-math \\\n--enable-ext-nbt \\\n',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing compile.sh anchor: {old!r}')
              text = text.replace(old, new, 1)
          compile_path.write_text(text)

          matrix_path = Path('.github/workflows/main-pm-matrix.yml')
          matrix = matrix_path.read_text()
          matrix_replacements = [
              ("hashFiles('./compile.sh', './compile-native.sh')", "hashFiles('./compile.sh')"),
              ('bash ./compile-native.sh \\\n', 'bash ./compile.sh \\\n'),
              ('            compile-native.sh\n', ''),
          ]
          for old, new in matrix_replacements:
              if old not in matrix:
                  raise SystemExit(f'Missing workflow anchor: {old!r}')
              matrix = matrix.replace(old, new, 1)
          matrix_path.write_text(matrix)

          main_path = Path('.github/workflows/main.yml')
          main = main_path.read_text()
          start_marker = '  # BEGIN TEMP NATIVE PROMOTION\n'
          end_marker = '  # END TEMP NATIVE PROMOTION\n'
          start = main.index(start_marker)
          end = main.index(end_marker, start) + len(end_marker)
          main_path.write_text(main[:start] + main[end:])
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch compile-native.sh .github/workflows/promote-native-extensions.yml
          git add compile.sh .github/workflows/main-pm-matrix.yml .github/workflows/main.yml
          git commit -m 'Build native Math, NBT and pathfinder directly [native compile promoted]'
          git push origin HEAD:agent/native-math-nbt
  # END TEMP NATIVE PROMOTION

  build-linux:
    name: PM5 - PHP 8.4 Linux

    permissions:
      contents: write

    uses: ./.github/workflows/main-pm-matrix.yml
    with:
      pm-version-major: 5
      php-version-base: "8.4"
      special-release: default-latest
      pm-preview: false
    secrets: inherit

  publish-archive-release:
    name: Publish archive release
    needs: [build-linux]
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    if: ${{ github.ref_name == 'stable' && github.ref_type == 'branch' && !contains(github.event.head_commit.message, '[no release]') }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: ${{ github.workspace }}

      - name: Generate release notes
        run: |
          echo "Built by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> changelog.md
          echo "Build number: ${{ github.run_number }}" >> changelog.md
          echo -e "\n\n\n" >> changelog.md
          echo ":information_source: **Linux/MacOS users**: Please see [this page](https://doc.pmmp.io/en/rtfd/faq/installation/opcache.so.html) to fix extension loading errors." >> changelog.md

      - name: Create release
        uses: ncipollo/release-action@v1.20.0
        with:
          artifacts: |
            ${{ github.workspace }}/*PHP-8.4-Linux-PM5/*.tar.gz
            ${{ github.workspace }}/*PHP-8.4.gdbinit/*.gdbinit
          name: PHP 8.4 Linux PM5 (Build ${{ github.run_number }})
          tag: php-build-${{ github.run_number }}
          commit: ${{ github.sha }}
          allowUpdates: false
          bodyFile: ${{ github.workspace }}/changelog.md
