name: Promote native extensions into compile.sh

on:
  pull_request:
    branches:
      - stable

permissions:
  contents: write

jobs:
  promote:
    if: ${{ github.head_ref == 'agent/native-math-nbt' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/native-math-nbt

      - name: Patch and commit compile.sh
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('compile.sh')
          text = path.read_text()

          changes = [
              (
                  'EXT_PATHFINDER_VERSION="132f6c13d864bc7b48521555b9bd8cbd2706cb4c"',
                  'EXT_PATHFINDER_VERSION="4f62992e518bd2fc8797103b5a7e3690166b074b"\n'
                  'EXT_MATH_VERSION="ceee39ac0ece476accaa09e58aeb70f66276b6c7"\n'
                  'EXT_NBT_VERSION="099ccb67c57fc0893b2c388f89f363f89f389a51"',
              ),
              (
                  'get_github_extension "pathfinder" "$EXT_PATHFINDER_VERSION" "TrixNEW" "ext-pathfinder"',
                  'get_github_extension "pathfinder" "$EXT_PATHFINDER_VERSION" "RavePvP" "ext-pathfinder"\n'
                  'get_github_extension "ext_math" "$EXT_MATH_VERSION" "phpMine-MP" "ext-math"\n'
                  'get_github_extension "ext_nbt" "$EXT_NBT_VERSION" "phpMine-MP" "ext-nbt"',
              ),
              (
                  '--enable-pathfinder \\\n--enable-morton',
                  '--enable-pathfinder \\\n--enable-ext-math \\\n--enable-ext-nbt \\\n--enable-morton',
              ),
          ]

          for old, new in changes:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one compile.sh anchor, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compile.sh
          git commit -m 'Build native Math, NBT and pathfinder directly [native compile promoted]'
          git push origin HEAD:agent/native-math-nbt
